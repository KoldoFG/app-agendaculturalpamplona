<title>Agenda Cultural Pamplona</title>
<style>
:root{
  --paper:#ffffff;
  --ink:#000000;
  --ink-2:rgba(0,0,0,.56);
  --ink-3:rgba(0,0,0,.34);
  --hair:rgba(0,0,0,.30);
  --wash:#f3f2ef;
  --fino:0.5px;
  --punto:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='3' height='1'><circle cx='0.5' cy='0.5' r='0.35' fill='black'/></svg>") repeat-x left bottom;
  --fav:rgba(47,179,163,.15);
  --fav-pt:#2f9e92;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d0d0c; --ink:#f1efea;
    --ink-2:rgba(241,239,234,.56); --ink-3:rgba(241,239,234,.32);
    --hair:rgba(241,239,234,.28); --wash:#050504;
    --punto:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='3' height='1'><circle cx='0.5' cy='0.5' r='0.35' fill='rgb(241,239,234)'/></svg>") repeat-x left bottom;
    --fav:rgba(63,200,182,.17);
    --fav-pt:#49c3b4;
  }
}
:root[data-theme="dark"]{
  --paper:#0d0d0c; --ink:#f1efea;
  --ink-2:rgba(241,239,234,.56); --ink-3:rgba(241,239,234,.32);
  --hair:rgba(241,239,234,.28); --wash:#050504;
  --punto:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='3' height='1'><circle cx='0.5' cy='0.5' r='0.35' fill='rgb(241,239,234)'/></svg>") repeat-x left bottom;
  --fav:rgba(63,200,182,.17);
  --fav-pt:#49c3b4;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wash);color:var(--ink);
  font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:inherit}

.app{position:relative;max-width:430px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
.esc{display:none}
@media (min-width:900px){
  .app{border-left:var(--fino) solid var(--hair);border-right:var(--fino) solid var(--hair)}
  .esc{display:block;position:fixed;width:16px;height:16px;pointer-events:none;z-index:5}
  .esc.tl{left:calc(50% - 215px - 22px);top:22px;border-left:var(--fino) solid var(--ink);border-top:var(--fino) solid var(--ink)}
  .esc.br{left:calc(50% + 215px + 6px);bottom:22px;border-right:var(--fino) solid var(--ink);border-bottom:var(--fino) solid var(--ink)}
}

/* cabecera */
.hdr{flex:0 0 auto;padding:14px 18px 0}
.hdr-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{margin:0;font-size:15px;font-weight:700}
.stamp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.sub{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.buscar{display:flex;align-items:baseline;gap:8px;margin:12px 0 0;padding-bottom:8px;background:var(--punto)}
.buscar label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.buscar input{flex:1 1 auto;min-width:0;border:0;background:none;padding:2px 0;outline:none;font-size:15px}
.buscar input::placeholder{color:var(--ink-3)}
.borrar-q{border:0;background:none;padding:2px 0;cursor:pointer;font-size:13px;color:var(--ink-2);border-bottom:var(--fino) solid var(--hair)}
.resumen{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0 8px;font-size:13px;color:var(--ink-2)}
.resumen b{color:var(--ink);font-weight:700}
.nav-mes{display:flex;align-items:baseline;gap:12px}
.nav-mes button{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
.nav-mes span{font-size:13px;min-width:7.5em;text-align:center}

.scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 18px}

/* lista */
.dia{position:sticky;top:0;z-index:2;background:var(--paper);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:14px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.dia .cuenta{color:var(--ink-3);letter-spacing:.04em}
.dia.hoy{font-weight:700}
.ev{display:grid;grid-template-columns:48px 1fr;column-gap:10px;row-gap:2px;
  padding:10px 0 11px;background:var(--punto);cursor:pointer;align-items:baseline;
  width:100%;border:0;text-align:left;font:inherit;color:inherit}
.ev:focus-visible{outline:var(--fino) solid var(--ink);outline-offset:2px}
.hora{font-size:13px;font-weight:700}
.ev-tit{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.ev-meta{grid-column:2;font-size:13px;color:var(--ink-2);line-height:1.45;overflow-wrap:anywhere}
.quien{grid-column:2;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.varios{grid-column:2;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ev.fav{background:var(--punto);background-color:var(--fav);
  box-shadow:-18px 0 0 var(--fav),18px 0 0 var(--fav)}
.puntos i.fav{background:var(--fav-pt);border-radius:50%;width:5px;height:5px}
.celda.sel .puntos i.fav{background:var(--fav-pt)}
.hoja-pie.tres{grid-template-columns:1fr 1fr 1fr}
.hoja-pie button.favon{background:var(--fav);color:var(--ink)}
.vacio{padding:40px 0;color:var(--ink-2);font-size:13px}
.pie{padding:22px 0 34px;font-size:11px;line-height:1.6;color:var(--ink-3)}

/* rejilla del mes */
.rejilla{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin:4px 0 0;
  border-top:var(--fino) solid var(--hair)}
.rejilla .cab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  text-align:center;padding:7px 0 6px;border-bottom:var(--fino) solid var(--hair)}
.celda{position:relative;aspect-ratio:1/1;border:0;border-right:var(--fino) solid var(--hair);
  border-bottom:var(--fino) solid var(--hair);background:none;cursor:default;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:inherit;color:inherit;padding:0;min-width:0}
.celda:nth-child(7n){border-right:0}
.celda .n{font-size:13px;line-height:1}
.celda.fuera .n{color:var(--ink-3)}
.celda.con{cursor:pointer}
.celda.con .n{font-weight:700}
.puntos{display:flex;gap:2px;height:4px;align-items:center}
.puntos i{width:3px;height:3px;background:var(--ink);display:block}
.celda.cartel:after{content:"";position:absolute;left:22%;right:22%;bottom:7px;
  height:0;border-bottom:var(--fino) solid var(--hair)}
.celda.sel.cartel:after{border-bottom-color:var(--paper)}
.grupo{padding:16px 0 2px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.celda.hoy .n{background:var(--ink);color:var(--paper);
  width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center}
.celda.sel{background:var(--ink)}
.celda.sel .n{color:var(--paper);background:none}
.celda.sel .puntos i{background:var(--paper)}
.dia-sel{padding:14px 0 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}

/* barra inferior */
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);
  border-top:var(--fino) solid var(--ink);padding-bottom:env(safe-area-inset-bottom);background:var(--paper)}
.tabbar button{border:0;background:none;padding:13px 6px;cursor:pointer;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;min-height:46px}
.tabbar button + button{border-left:var(--fino) solid var(--hair)}
.tabbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* hojas */
.hoja{position:absolute;inset:0;z-index:10;background:var(--paper);
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease}
.hoja.abierta{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.hoja{transition:none}}
.hoja-top{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:16px 18px 10px;background:var(--punto)}
.hoja-top h2{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.cerrar{border:0;background:none;cursor:pointer;font-size:13px;border-bottom:var(--fino) solid var(--ink);padding:0 0 1px}
.hoja-body{flex:1 1 auto;overflow-y:auto;padding:0 18px 30px}
.hoja-pie{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;
  border-top:var(--fino) solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.hoja-pie button{border:0;background:none;padding:13px 6px;cursor:pointer;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;min-height:46px}
.hoja-pie button + button{border-left:var(--fino) solid var(--hair);background:var(--ink);color:var(--paper)}

.campo{padding:13px 0 12px;background:var(--punto)}
.campo > .et{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:7px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{border:var(--fino) solid var(--hair);background:none;cursor:pointer;padding:6px 10px;font-size:13px;line-height:1.2}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg:focus-visible{outline:var(--fino) solid var(--ink);outline-offset:2px}

.ficha-tit{font-size:19px;line-height:1.28;margin:14px 0 2px;text-wrap:balance;overflow-wrap:anywhere}
.ficha-sub{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.dl{display:grid;grid-template-columns:104px 1fr}
.dl dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:9px 10px 9px 0;background:var(--punto)}
.dl dd{margin:0;padding:9px 0;background:var(--punto);font-size:15px;overflow-wrap:anywhere}
.desc{margin:18px 0 0;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.enlaces{display:flex;flex-direction:column;gap:12px;margin:22px 0 0;align-items:flex-start}
.enlaces a{text-decoration:none;border-bottom:var(--fino) solid var(--ink);padding-bottom:2px;font-size:15px}
</style>

<div class="esc tl"></div><div class="esc br"></div>

<div class="app">
  <header class="hdr">
    <div class="hdr-top">
      <h1>Agenda cultural · Pamplona</h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <p class="sub" id="sub"></p>
    <div class="buscar">
      <label for="q">Buscar</label>
      <input id="q" type="text" inputmode="search" autocomplete="off" placeholder="título, ponente, ciclo, lugar">

    <div class="resumen">

  <div class="scroll" id="scroll">

  <nav class="tabbar">

      <button type="button" id="fichaFav">Favorito</button>

  <section class="hoja" id="hojaFiltros" aria-hidden="true">

      <button class="cerrar" type="button" data-cerrar="hojaFiltros">cerrar</button></div>
    <div class="hoja-body">
      <div class="campo"><span class="et">Cuándo</span><div class="segs" id="segCuando"></div></div>
      <div class="campo"><span class="et">Selección</span><div class="segs" id="segFav"></div></div>
      <div class="campo"><span class="et">Tipo de actividad</span><div class="segs" id="segTipo"></div></div>
      <div class="campo"><span class="et">Categoría</span><div class="segs" id="segCat"></div></div>
      <div class="campo"><span class="et">Lugar</span><div class="segs" id="segLugar"></div></div>
      <div class="campo"><span class="et">Ciclo</span><div class="segs" id="segCiclo"></div></div>
    </div>
    <div class="hoja-pie">
      <button type="button" id="limpiar">Quitar filtros</button>
      <button type="button" id="verResultados">Ver <span id="nres"></span></button>
    </div>
  </section>
</div>

seo Universidad de Navarra · Temporada 26/27","url":"https://museo.unav.edu/agenda","pagina":null,"id":"mun-2027-05-21-1930-ballet-junior-de-la-opera-nacional-de-paris","tipo":"Escénicas"}]</script>
<script>
function arrancarApp(BASE){
"use strict";

var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
             "septiembre","octubre","noviembre","diciembre"];
var DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var CAB = ["L","M","X","J","V","S","D"];

var HOY = new Date(); HOY.setHours(0,0,0,0);
function iso(d){ return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
var HOY_ISO = iso(HOY);
function fecha(s){ return new Date(s + "T00:00:00"); }
function dias(a, b){ return Math.round((fecha(a) - (b ? fecha(b) : HOY)) / 86400000); }

function minutos(h){
  var m = /^(\d{1,2}):(\d{2})$/.exec(h || "");
  return m ? Number(m[1])*60 + Number(m[2]) : 24*60;
}

function soloNombres(t){
  return (t || "").replace(/\([^)]*\)/g, "")
         .replace(/\s+([.,;])/g, "$1").replace(/\s*,\s*(?=y )/g, " ")
         .replace(/\s{2,}/g, " ").replace(/[\s.]+$/, "").trim();
}
BASE.forEach(function(e){
  e._min = minutos(e.hora);
  e.sede = (e.lugar || "").split(" · ")[0];
  e._quien = soloNombres(e.ponentes);
  e._busca = [e.titulo, e.formato, e.ciclo, e.lugar, e.categoria, e.fuente, e.ponentes, e.descripcion]
             .join(" ").toLowerCase();
});
BASE.sort(function(a,b){ return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : a._min - b._min; });

var $ = function(id){ return document.getElementById(id); };

var FAV = new Set();
try { JSON.parse(localStorage.getItem("agenda_favoritos") || "[]").forEach(function(k){ FAV.add(k); }); }
catch(err){}
function guardarFav(){
  try { localStorage.setItem("agenda_favoritos", JSON.stringify([].concat(Array.from(FAV)))); }
  catch(err){}
}
/* la app abre con las conferencias delante: es lo que más se consulta */
var TIPO_INICIAL = "Conferencia";
var F = { q:"", cuando:"proximos", solofav:false, tipo:new Set([TIPO_INICIAL]),
          cat:new Set(), lugar:new Set(), ciclo:new Set() };
var vista = "lista";
var mesVisible = (function(){ var d = new Date(HOY); d.setDate(1); return d; })();
var diaSel = null;

function valores(campo){
  var c = {};
  BASE.forEach(function(e){ if(e[campo]) c[e[campo]] = (c[e[campo]]||0) + 1; });
  return Object.keys(c).sort(function(a,b){ return c[b] - c[a] || (a < b ? -1 : 1); })
          .map(function(k){ return {v:k, n:c[k]}; });
}
var TIPOS = valores("tipo"), CATS = valores("categoria"),
    LUGARES = valores("sede"), CICLOS = valores("ciclo");

function filtrar(){
  var finMes = null;
  if(F.cuando === "mes"){
    var d = new Date(mesVisible); d.setMonth(d.getMonth()+1); d.setDate(0);
    finMes = iso(d);
  }
  return BASE.filter(function(e){
    if(F.solofav && !FAV.has(e.id)) return false;
    if(F.tipo.size && !F.tipo.has(e.tipo)) return false;
    if(F.cat.size && !F.cat.has(e.categoria)) return false;
    if(F.lugar.size && !F.lugar.has(e.sede)) return false;
    if(F.ciclo.size && !F.ciclo.has(e.ciclo)) return false;
    if(F.q && e._busca.indexOf(F.q) === -1) return false;
    var vigente = e.hasta ? e.hasta >= HOY_ISO : e.fecha >= HOY_ISO;
    if(F.cuando === "proximos" && !vigente) return false;
    if(F.cuando === "semana" && !(vigente && e.fecha <= iso(new Date(HOY.getTime()+7*864e5)))) return false;
    if(F.cuando === "mes" && !(e.fecha <= finMes && (e.hasta || e.fecha) >= iso(mesVisible))) return false;
    return true;
  });
}
function nFiltros(){
  var n = F.tipo.size + F.cat.size + F.lugar.size + F.ciclo.size;
  if(F.cuando !== "proximos") n++;
  if(F.solofav) n++;
  return n;
}

function etiquetaDia(f){
  var d = dias(f);
  if(d === 0) return "hoy";
  if(d === 1) return "mañana";
  if(d < 0) return F.cuando === "todo" ? "pasó" : "en cartel";
  if(d < 7) return "en " + d + " días";
  return "";
}
function tituloDia(f){
  var d = fecha(f);
  return DIAS[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()];
}

function botonEvento(e){
  var b = document.createElement("button");
  b.type = "button"; b.className = "ev" + (FAV.has(e.id) ? " fav" : ""); b.dataset.id = e.id;
  var h = document.createElement("span"); h.className = "hora";
  h.textContent = e.hora || "—";
  var t = document.createElement("span"); t.className = "ev-tit";
  t.textContent = (e.formato ? e.formato + ": " : "") + e.titulo;
  var m = document.createElement("span"); m.className = "ev-meta";
  m.textContent = [e.tipo, e.sala || e.lugar, e.ciclo].filter(Boolean).join(" · ");
  b.appendChild(h); b.appendChild(t);
  if(e._quien){
    var q = document.createElement("span"); q.className = "quien";
    q.textContent = e._quien;
    b.appendChild(q);
  }
  b.appendChild(m);
  if(e.hasta){
    var v = document.createElement("span"); v.className = "varios";
    v.textContent = "hasta el " + fecha(e.hasta).getDate() + " de " + MESES[fecha(e.hasta).getMonth()];
    b.appendChild(v);
  }
  return b;
}

function pintarLista(rows, host){
  if(!rows.length){
    var p = document.createElement("p"); p.className = "vacio";
    p.textContent = "No hay nada con estos filtros. Prueba a quitar alguno.";
    host.appendChild(p); return;
  }
  /* lo que empezó antes de hoy y sigue vivo no abre la lista con fechas pasadas:
     va en un grupo propio al principio, y la lista arranca en el día de hoy */
  var enCartel = [], porDia = [];
  rows.forEach(function(e){
    if(F.cuando !== "todo" && e.fecha < HOY_ISO) enCartel.push(e); else porDia.push(e);
  });

  if(enCartel.length){
    var hc = document.createElement("div");
    hc.className = "dia";
    var ac = document.createElement("span"); ac.textContent = "Ya en cartel";
    var bc = document.createElement("span"); bc.className = "cuenta";
    bc.textContent = enCartel.length + (enCartel.length === 1 ? " actividad" : " actividades");
    hc.appendChild(ac); hc.appendChild(bc);
    host.appendChild(hc);
    enCartel.sort(function(a, b){
      return (a.hasta || a.fecha) < (b.hasta || b.fecha) ? -1 : 1;   // lo que antes se acaba, primero
    }).forEach(function(e){ host.appendChild(botonEvento(e)); });
  }

  var ultimo = null;
  porDia.forEach(function(e){
    if(e.fecha !== ultimo){
      ultimo = e.fecha;
      var h = document.createElement("div");
      h.className = "dia" + (e.fecha === HOY_ISO ? " hoy" : "");
      var a = document.createElement("span"); a.textContent = tituloDia(e.fecha);
      var b = document.createElement("span"); b.className = "cuenta"; b.textContent = etiquetaDia(e.fecha);
      h.appendChild(a); h.appendChild(b);
      host.appendChild(h);
    }
    host.appendChild(botonEvento(e));
  });
}

function pintarMes(rows, host){
  var empiezan = {}, siguen = {};
  rows.forEach(function(e){
    (empiezan[e.fecha] = empiezan[e.fecha] || []).push(e);
    if(e.hasta){
      var d = fecha(e.fecha), fin = fecha(e.hasta);
      d.setDate(d.getDate()+1);
      for(; d <= fin; d.setDate(d.getDate()+1)){
        (siguen[iso(d)] = siguen[iso(d)] || []).push(e);
      }
    }
  });

  var primero = new Date(mesVisible);
  var arranque = (primero.getDay() + 6) % 7;            // lunes = 0
  var ultimo = new Date(mesVisible); ultimo.setMonth(ultimo.getMonth()+1); ultimo.setDate(0);
  var total = Math.ceil((arranque + ultimo.getDate()) / 7) * 7;

  var g = document.createElement("div"); g.className = "rejilla";
  CAB.forEach(function(c){
    var h = document.createElement("div"); h.className = "cab"; h.textContent = c; g.appendChild(h);
  });
  for(var i = 0; i < total; i++){
    var d = new Date(primero); d.setDate(1 - arranque + i);
    var k = iso(d), hay = empiezan[k] || [], cartel = siguen[k] || [];
    var c = document.createElement("button");
    c.type = "button";
    c.className = "celda" + (d.getMonth() !== primero.getMonth() ? " fuera" : "")
      + (hay.length || cartel.length ? " con" : "") + (cartel.length ? " cartel" : "")
      + (k === HOY_ISO ? " hoy" : "") + (k === diaSel ? " sel" : "");
    c.dataset.fecha = k;
    if(!hay.length && !cartel.length) c.disabled = true;
    var n = document.createElement("span"); n.className = "n"; n.textContent = d.getDate();
    c.appendChild(n);
    var p = document.createElement("span"); p.className = "puntos";
    for(var j = 0; j < Math.min(hay.length, 4); j++){
      var punto = document.createElement("i");
      if(FAV.has(hay[j].id)) punto.className = "fav";
      p.appendChild(punto);
    }
    c.appendChild(p);
    g.appendChild(c);
  }
  host.appendChild(g);

  if(diaSel && ((empiezan[diaSel] || []).length || (siguen[diaSel] || []).length)){
    var t = document.createElement("div"); t.className = "dia-sel";
    t.textContent = tituloDia(diaSel);
    host.appendChild(t);
    (empiezan[diaSel] || []).slice().sort(function(a,b){ return a._min - b._min; })
      .forEach(function(e){ host.appendChild(botonEvento(e)); });
    if((siguen[diaSel] || []).length){
      var g = document.createElement("div"); g.className = "grupo";
      g.textContent = "sigue en cartel";
      host.appendChild(g);
      siguen[diaSel].forEach(function(e){ host.appendChild(botonEvento(e)); });
    }
  } else {
    var aviso = document.createElement("p"); aviso.className = "vacio";
    aviso.textContent = "Toca un día marcado para ver lo que hay. Los puntos son lo que empieza ese día; la raya fina, lo que sigue en cartel.";
    host.appendChild(aviso);
  }
}

function pintar(){
  var rows = filtrar();
  var host = $("cuerpo");
  host.textContent = "";

  $("estado").innerHTML = "<b>" + rows.length + "</b> de " + BASE.length;
  $("nfiltros").textContent = nFiltros() ? "· " + nFiltros() : "";
  $("nres").textContent = rows.length;
  $("borrarq").hidden = !F.q;
  $("navmes").hidden = vista !== "mes";
  $("tabLista").setAttribute("aria-pressed", vista === "lista" ? "true" : "false");
  $("tabMes").setAttribute("aria-pressed", vista === "mes" ? "true" : "false");
  $("mesTit").textContent = MESES[mesVisible.getMonth()] + " " + mesVisible.getFullYear();

  if(vista === "lista") pintarLista(rows, host); else pintarMes(rows, host);
}

$("cuerpo").addEventListener("click", function(ev){
  var celda = ev.target.closest(".celda");
  if(celda && !celda.disabled){
    diaSel = (diaSel === celda.dataset.fecha) ? null : celda.dataset.fecha;
    pintar();
    return;
  }
  var b = ev.target.closest(".ev");
  if(b) abrirFicha(BASE.filter(function(e){ return e.id === b.dataset.id; })[0]);
});

/* ---------- ficha ---------- */
var fichaActual = null;
function fila(dl, k, v){
  if(!v) return;
  var dt = document.createElement("dt"); dt.textContent = k;
  var dd = document.createElement("dd"); dd.textContent = v;
  dl.appendChild(dt); dl.appendChild(dd);
}
function abrirFicha(e){
  if(!e) return;
  fichaActual = e;
  var body = $("fichaBody"); body.textContent = "";
  $("fichaCab").textContent = e.tipo || "Actividad";

  var h = document.createElement("h3"); h.className = "ficha-tit";
  h.textContent = e.titulo; body.appendChild(h);
  var s = document.createElement("p"); s.className = "ficha-sub";
  s.textContent = [e.formato, e.ciclo].filter(Boolean).join(" · "); body.appendChild(s);

  var dl = document.createElement("dl"); dl.className = "dl";
  var d = dias(e.fecha);
  fila(dl, "Fecha", tituloDia(e.fecha) + (d === 0 ? " · hoy" : d === 1 ? " · mañana"
      : d > 0 ? " · en " + d + " días" : ""));
  if(e.hasta) fila(dl, "Hasta", tituloDia(e.hasta));
  fila(dl, "Hora", e.hora);
  fila(dl, "Lugar", [e.lugar, e.sala].filter(Boolean).join(" · "));
  fila(dl, "Quién", e.ponentes);
  fila(dl, "Ciclo", e.ciclo);
  fila(dl, "Tipo", e.tipo);
  fila(dl, "Categoría", e.categoria);
  fila(dl, "Programa", e.fuente + (e.pagina ? " · pág. " + e.pagina : ""));
  body.appendChild(dl);

  if(e.descripcion){
    var p = document.createElement("p"); p.className = "desc";
    p.textContent = e.descripcion;
    body.appendChild(p);
  }

  pintarBotonFav();
  $("fichaAbrir").style.opacity = /^https?:/.test(e.url || "") ? "1" : ".45";
  body.scrollTop = 0;
  abrirHoja("hojaFicha");
}
function pintarBotonFav(){
  var marcado = fichaActual && FAV.has(fichaActual.id);
  $("fichaFav").textContent = marcado ? "Quitar favorito" : "Favorito";
  $("fichaFav").className = marcado ? "favon" : "";
}
$("fichaFav").addEventListener("click", function(){
  if(!fichaActual) return;
  if(FAV.has(fichaActual.id)) FAV.delete(fichaActual.id); else FAV.add(fichaActual.id);
  guardarFav();
  pintarBotonFav();
  pintar();
});
$("fichaAbrir").addEventListener("click", function(){
  if(fichaActual && /^https?:/.test(fichaActual.url || "")) window.open(fichaActual.url, "_blank", "noopener");
});
$("fichaDia").addEventListener("click", function(){
  if(!fichaActual) return;
  diaSel = fichaActual.fecha;
  mesVisible = new Date(fecha(diaSel).getFullYear(), fecha(diaSel).getMonth(), 1);
  vista = "mes";
  cerrarHoja("hojaFicha");
  pintar();
  $("scroll").scrollTop = 0;
});

/* ---------- hojas ---------- */
function abrirHoja(id){ var h = $(id); h.classList.add("abierta"); h.setAttribute("aria-hidden","false"); }
function cerrarHoja(id){
  var h = $(id); h.classList.remove("abierta"); h.setAttribute("aria-hidden","true");
  $("tabFiltros").setAttribute("aria-pressed","false");
}
Array.prototype.forEach.call(document.querySelectorAll("[data-cerrar]"), function(b){
  b.addEventListener("click", function(){ cerrarHoja(b.dataset.cerrar); });
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ cerrarHoja("hojaFicha"); cerrarHoja("hojaFiltros"); }
});

/* ---------- filtros ---------- */
function unico(host, opciones, leer, escribir){
  host.textContent = "";
  opciones.forEach(function(o){
    var b = document.createElement("button");
    b.type = "button"; b.className = "seg"; b.textContent = o.et;
    b.setAttribute("aria-pressed", leer() === o.v ? "true" : "false");
    b.addEventListener("click", function(){
      escribir(o.v);
      Array.prototype.forEach.call(host.children, function(x){ x.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
      pintar();
    });
    host.appendChild(b);
  });
}
function multiple(host, valores, conjunto){
  host.textContent = "";
  valores.forEach(function(o){
    var b = document.createElement("button");
    b.type = "button"; b.className = "seg";
    b.textContent = o.v + " " + o.n;
    b.setAttribute("aria-pressed", conjunto.has(o.v) ? "true" : "false");
    b.addEventListener("click", function(){
      if(conjunto.has(o.v)) conjunto.delete(o.v); else conjunto.add(o.v);
      b.setAttribute("aria-pressed", conjunto.has(o.v) ? "true" : "false");
      pintar();
    });
    host.appendChild(b);
  });
}
var CUANDO = [{v:"proximos",et:"lo que viene"},{v:"semana",et:"7 días"},
              {v:"mes",et:"el mes a la vista"},{v:"todo",et:"todo"}];
function pintarFiltros(){
  unico($("segFav"), [{v:false,et:"todo"},{v:true,et:"solo favoritos"}],
        function(){ return F.solofav; }, function(v){ F.solofav = v; });
  unico($("segCuando"), CUANDO, function(){ return F.cuando; }, function(v){ F.cuando = v; });
  multiple($("segTipo"), TIPOS, F.tipo);
  multiple($("segCat"), CATS, F.cat);
  multiple($("segLugar"), LUGARES, F.lugar);
  multiple($("segCiclo"), CICLOS, F.ciclo);
}
pintarFiltros();

$("q").addEventListener("input", function(){ F.q = this.value.trim().toLowerCase(); pintar(); });
$("borrarq").addEventListener("click", function(){ $("q").value = ""; F.q = ""; pintar(); $("q").focus(); });
$("limpiar").addEventListener("click", function(){
  F.q = ""; F.cuando = "proximos"; F.solofav = false; F.tipo.clear(); F.cat.clear(); F.lugar.clear(); F.ciclo.clear();
  $("q").value = ""; pintarFiltros(); pintar();
});
$("verResultados").addEventListener("click", function(){ cerrarHoja("hojaFiltros"); $("scroll").scrollTop = 0; });
$("tabFiltros").addEventListener("click", function(){ this.setAttribute("aria-pressed","true"); abrirHoja("hojaFiltros"); });
$("tabLista").addEventListener("click", function(){ vista = "lista"; pintar(); $("scroll").scrollTop = 0; });
$("tabMes").addEventListener("click", function(){
  vista = "mes";
  if(!diaSel) diaSel = HOY_ISO;
  pintar(); $("scroll").scrollTop = 0;
});
$("mesAnt").addEventListener("click", function(){ mesVisible.setMonth(mesVisible.getMonth()-1); diaSel = null; pintar(); });
$("mesSig").addEventListener("click", function(){ mesVisible.setMonth(mesVisible.getMonth()+1); diaSel = null; pintar(); });

/* ---------- cabecera ---------- */
(function(){
  var vigentes = BASE.filter(function(e){ return (e.hasta || e.fecha) >= HOY_ISO; }).length;
  var fuentes = {};
  BASE.forEach(function(e){ fuentes[e.fuente] = 1; });
  var rango = BASE.length ? [BASE[0].fecha, BASE[BASE.length-1].fecha] : null;
  $("stamp").textContent = rango ? MESES[fecha(rango[0]).getMonth()].slice(0,3) + "–"
      + MESES[fecha(rango[1]).getMonth()].slice(0,3) + " " + fecha(rango[1]).getFullYear() : "";
  $("sub").textContent = BASE.length + " actividades · " + vigentes + " por venir";
  $("pie").textContent = "Fuentes: " + Object.keys(fuentes).join("; ") +
    ". Las fechas y horas salen del programa publicado; confirma siempre en la web del centro " +
    "antes de ir, que los horarios cambian.";
})();

pintar();
}

/* ---------- datos: van dentro, y se refrescan si hay un eventos.json al lado ---------- */
(function(){
  var EMBEBIDA = JSON.parse(document.getElementById("datos").textContent);
  document.getElementById("estado").textContent = "Cargando la agenda\u2026";

  function sello(d){
    try { return d.length + "|" + d.reduce(function(m, r){
      var f = (r.fecha || "") + (r.id || ""); return f > m ? f : m; }, ""); }
    catch (e) { return ""; }
  }

  function cargar(u){
    return new Promise(function(res){
      var hecho = false;
      function fin(v){ if(!hecho){ hecho = true; clearTimeout(t); res(v); } }
      var t = setTimeout(function(){ fin(null); }, 4000);
      try {
        fetch(u + "?" + Date.now(), {cache: "no-store"})
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){ fin(Array.isArray(d) && d.length ? d : null); })
          .catch(function(){ fin(null); });
      } catch (e) { fin(null); }
    });
  }

  cargar("eventos.json").then(function(d){
    // se queda con la que traiga más actividades: la de fuera solo gana si ha crecido
    arrancarApp(d && d.length >= EMBEBIDA.length ? d : EMBEBIDA);
  });
})();

</script>
